[project]
name = "gml_npad_formatter"
description = "pygeoapi output formatter for SOSI-GML NPAD"
version = "0.5.1"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Arkitektum AS" }]
dependencies = [
    "pygeoapi",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "types-lxml",
]
smoke = [
    "pytest",
    # psycopg3 is what the smoke conftest uses for direct schema/fixture loading.
    "psycopg[binary]>=3.2.9",
    # psycopg2-binary is what SQLAlchemy's default postgres dialect reaches for;
    # postgresql_provider builds its engine via that dialect. Matches the pattern in
    # pygeoapi.plandata's Dockerfile, which also installs both side by side.
    "psycopg2-binary>=2.9",
    # Resolved from the workspace (packages/postgresql_provider), so the smoke tests
    # run against the provider as it is in this repo, not a pinned release.
    "postgresql_provider",
]

[tool.uv.sources]
postgresql_provider = { workspace = true }

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gml_npad_formatter = ["py.typed"]

[tool.ty.src]
# The smoke tests import psycopg + postgresql_provider, which aren't installed
# in the default dev environment. Skip them from static analysis; the smoke
# CI job installs the smoke extras and runs pytest-side import checks via
# pytest.importorskip.
exclude = ["tests/smoke/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: integration smoke test, requires running postgres (run with `pytest -m smoke`)",
]
# Default runs exclude smoke tests; they need a live postgres which most
# developer environments don't have. Opt in with `pytest -m smoke`.
addopts = "-m 'not smoke'"
