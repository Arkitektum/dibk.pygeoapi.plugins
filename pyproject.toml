# Virtual workspace root: not a package itself, only ties the plugins in
# packages/ together under one lockfile and shared dev tooling. Each plugin
# keeps its own pyproject.toml, version and release tag.

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff",
    "types-lxml",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
# Pinned to ruff's classic default rule set, so a ruff upgrade that widens
# the defaults does not start failing CI on its own.
select = ["E4", "E7", "E9", "F"]
